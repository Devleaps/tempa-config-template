name: Check config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: release zip is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_release.py --check

  policies:
    name: policies compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - run: opa check policies
